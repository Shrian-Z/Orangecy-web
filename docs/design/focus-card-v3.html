<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Orangecy · Focus Card v3</title>
<style>
  :root {
    --blue: #002FA7;
    --white: #FFFFFF;
    --ink: var(--blue);
    --ink-80: rgba(0, 47, 167, 0.80);
    --ink-70: rgba(0, 47, 167, 0.70);
    --ink-55: rgba(0, 47, 167, 0.55);
    --ink-48: rgba(0, 47, 167, 0.48);
    --ink-40: rgba(0, 47, 167, 0.40);
    --ink-34: rgba(0, 47, 167, 0.34);
    --ink-28: rgba(0, 47, 167, 0.28);
    --ink-18: rgba(0, 47, 167, 0.18);
    --ink-08: rgba(0, 47, 167, 0.08);
    --paper: var(--white);
    --font: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; }
  body.capture * { transition: none !important; animation: none !important; }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: max(18px, env(safe-area-inset-top));
    background: var(--paper);
  }

  .status {
    flex: 0 0 auto;
    width: min(720px, 100% - 40px);
    height: 44px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .counter {
    font-size: 12px;
    line-height: 1;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-40);
  }
  .counter b { color: var(--ink); font-weight: 500; }
  .counter i { font-style: normal; color: var(--ink-28); margin: 0 7px; }
  .mute {
    appearance: none;
    border: 0;
    background: transparent;
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--ink-55);
    cursor: pointer;
    border-radius: 50%;
  }
  .mute:hover { color: var(--ink-80); }
  .mute:focus-visible { outline: 2px solid var(--ink-40); outline-offset: 2px; }
  .mute svg { width: 20px; height: 20px; }
  .icon-muted { display: none; }
  body[data-state="muted"] .mute { color: var(--ink); }
  body[data-state="muted"] .icon-volume { display: none; }
  body[data-state="muted"] .icon-muted { display: block; }

  .card {
    flex: 1 1 auto;
    width: min(720px, 100% - 40px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-bottom: 4px;
  }
  .card-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding-top: clamp(24px, 8vh, 92px);
  }
  .card-body::-webkit-scrollbar { display: none; }

  .lyrics { margin: 0; }
  .line {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 34px);
    line-height: 1.5;
    letter-spacing: -0.015em;
    color: var(--ink-55);
    transition: color 420ms var(--ease);
  }
  .line + .line { margin-top: 10px; }
  .line.is-active { color: var(--ink); }
  .line.is-past { color: var(--ink-55); }
  .line.is-next { color: var(--ink-34); }
  mark {
    background: transparent;
    color: var(--ink);
    font-weight: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 5px;
    text-decoration-color: var(--ink-40);
  }

  .progress {
    width: 168px;
    height: 2px;
    margin-top: 30px;
    background: var(--ink-08);
    overflow: hidden;
  }
  .progress span {
    display: block;
    height: 100%;
    width: var(--p, 0%);
    background: var(--ink);
    transform-origin: left center;
  }
  body[data-state="playing"] .progress span,
  body[data-state="muted"] .progress span {
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .word-block { margin-top: clamp(56px, 15vh, 160px); }
  .word {
    margin: 0;
    font-size: clamp(58px, 6.8vw, 100px);
    font-weight: 350;
    line-height: 0.95;
    letter-spacing: -0.045em;
    color: var(--ink);
  }
  .phonetic {
    margin: 14px 0 0;
    font-size: 14px;
    line-height: 1.4;
    letter-spacing: 0.03em;
    color: var(--ink-40);
  }

  .meaning {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition:
      grid-template-rows 380ms var(--ease),
      opacity 280ms ease;
  }
  .meaning > div { overflow: hidden; }
  body[data-state="expanded"] .meaning { grid-template-rows: 1fr; opacity: 1; }
  .sense {
    margin: 26px 0 0;
    font-size: 19px;
    line-height: 1.65;
    color: var(--ink-80);
  }
  .knowledge {
    margin: 10px 0 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-48);
    max-width: 560px;
  }
  .example {
    margin: 14px 0 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-55);
  }
  .example span {
    margin-left: 8px;
    font-size: 13px;
    color: var(--ink-40);
  }

  .actions {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
    margin-top: 28px;
    height: 52px;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    visibility: hidden;
    transition:
      opacity 240ms ease 80ms,
      transform 240ms var(--ease) 80ms,
      visibility 0ms linear 320ms;
  }
  body[data-state="expanded"] .actions {
    opacity: 1;
    transform: none;
    pointer-events: auto;
    visibility: visible;
    transition:
      opacity 240ms ease 80ms,
      transform 240ms var(--ease) 80ms,
      visibility 0ms linear 0ms;
  }
  .actions button {
    flex: 1 1 0;
    height: 52px;
    border-radius: 14px;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .actions button:focus-visible { outline: 2px solid var(--ink-40); outline-offset: 2px; }
  .ghost {
    background: transparent;
    border: 1px solid var(--ink-18);
    color: var(--ink-70);
  }
  .ghost:hover { border-color: var(--ink-28); color: var(--ink-80); }
  .solid {
    background: var(--ink);
    border: 1px solid var(--ink);
    color: var(--white);
  }
  .solid:hover { background: rgba(0, 47, 167, 0.92); }

  .tabs {
    flex: 0 0 auto;
    height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tabs-inner {
    width: min(720px, 100% - 40px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    height: 48px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--ink-40);
    cursor: pointer;
  }
  .tab:hover { color: var(--ink-40); }
  .tab.is-active { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--ink-40); outline-offset: 2px; }
  .tab svg { width: 22px; height: 22px; }

  @media (max-height: 700px) {
    .app { padding-top: max(8px, env(safe-area-inset-top)); }
    .card-body { padding-top: 12px; }
    .line { font-size: 20px; line-height: 1.45; }
    .progress { margin-top: 18px; width: 132px; }
    .word-block { margin-top: 26px; }
    .word { font-size: 52px; }
    .phonetic { margin-top: 10px; font-size: 12px; }
    .sense { margin-top: 16px; font-size: 16px; }
    .knowledge { font-size: 12.5px; line-height: 1.55; }
    .example { font-size: 13px; margin-top: 10px; }
    .example span { font-size: 11.5px; }
    .actions { margin-top: 18px; height: 46px; }
    .actions button { height: 46px; font-size: 14px; }
    .tabs { height: calc(54px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body data-state="collapsed">
  <div class="app">
    <header class="status">
      <span class="counter"><b>03</b><i>/</i>50</span>
      <button class="mute" type="button" aria-label="静音">
        <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
          <path d="M16 9a5 5 0 0 1 0 6"/>
          <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
          <line x1="22" x2="16" y1="9" y2="15"/>
          <line x1="16" x2="22" y1="9" y2="15"/>
        </svg>
      </button>
    </header>

    <main class="card" role="button" tabindex="0" aria-label="展开词义">
      <div class="card-body">
        <section class="lyrics" aria-label="歌词片段">
          <p class="line" data-line="1">Lately I've been I've been <mark>losing</mark> sleep</p>
          <p class="line" data-line="2">Dreaming about the things that we could be</p>
        </section>

        <div class="progress" aria-hidden="true"><span style="--p: 0%"></span></div>

        <section class="word-block" aria-label="单词">
          <h1 class="word">lose</h1>
          <p class="phonetic">/luːz/</p>
        </section>

        <section class="meaning" aria-hidden="true">
          <div>
            <p class="sense">v. 失去；丧失；输掉</p>
            <p class="knowledge">losing 是 lose 的现在分词；lose sleep over sth. 为某事失眠</p>
            <p class="example">I've been losing sleep.<span>我最近一直失眠。</span></p>
          </div>
        </section>
      </div>

      <div class="actions" role="group" aria-label="判断">
        <button class="ghost" type="button">模糊</button>
        <button class="solid" type="button">认识</button>
      </div>
    </main>

    <nav class="tabs" aria-label="主导航">
      <div class="tabs-inner">
        <button class="tab is-active" type="button" aria-label="学习">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </button>
        <button class="tab" type="button" aria-label="复习">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="tab" type="button" aria-label="词书">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
        </button>
        <button class="tab" type="button" aria-label="我的">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const state = params.get('state') || 'collapsed';
    document.body.dataset.state = state;
    if (params.get('capture') === '1') document.body.classList.add('capture');

    const lines = document.querySelectorAll('.line');
    if (state === 'playing' || state === 'muted') {
      lines[0].classList.add('is-active');
      lines[1].classList.add('is-next');
      document.querySelector('.progress span').style.setProperty('--p', '42%');
    } else {
      lines[0].classList.add('is-next');
      lines[1].classList.add('is-next');
    }
    if (state === 'expanded') {
      document.querySelector('.meaning').setAttribute('aria-hidden', 'false');
    }
  </script>
</body>
</html>
